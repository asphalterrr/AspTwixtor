<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AspTwixtor | Ten Shadows</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: radial-gradient(
        ellipse at top,
        #253653,
        #090e19 65%
    );
    color: #dce6fa;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
}

main {
    max-width: 540px;
    margin: auto;
    padding: 28px 18px;
}

header {
    border-bottom: 1px solid #34445d;
    margin-bottom: 24px;
}

h1 {
    font-size: 36px;
    letter-spacing: -2px;
    margin: 8px 0;
}

small {
    letter-spacing: 4px;
    color: #9eb5dc;
}

section {
    background: #101827;
    border: 1px solid #34445d;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 16px 40px #0006;
}

label {
    display: block;
    margin-top: 16px;
    color: #aabbd5;
}

input, select, button, a {
    font: inherit;
    color: inherit;
}

input, select, button {
    width: 100%;
    padding: 13px;
    background: #19263b;
    border: 1px solid #405675;
    border-radius: 9px;
    margin-top: 6px;
}

button {
    background: #344e79;
    font-weight: bold;
    margin-top: 22px;
}

button:disabled {
    opacity: 0.5;
}

video, canvas {
    width: 100%;
    max-height: 320px;
    background: #050810;
    border-radius: 10px;
    margin-top: 12px;
}

progress {
    width: 100%;
    accent-color: #819fd0;
    margin-top: 18px;
}

a {
    display: block;
    text-align: center;
    padding: 14px;
    background: #344e79;
    border-radius: 9px;
    text-decoration: none;
}

[hidden] {
    display: none !important;
}

p {
    color: #9eb0cc;
    font-size: 13px;
    line-height: 1.5;
}
</style>
</head>

<body>

<main>

<header>
    <small>十種影法術 / TEN SHADOWS</small>
    <h1>AspTwixtor</h1>
    <p>SHADOW FRAME ENGINE · GPU</p>
</header>

<section>

<label>Source Clip</label>
<input id="file" type="file" accept="video/*">

<video id="v" muted playsinline controls></video>

<label>Source FPS</label>
<select id="src">
    <option>24</option>
    <option selected>30</option>
    <option>60</option>
    <option>120</option>
    <option>240</option>
</select>

<label>Output FPS</label>
<select id="fps">
    <option>30</option>
    <option>60</option>
    <option>90</option>
    <option selected>120</option>
    <option>144</option>
    <option>240</option>
</select>

<label>Playback Speed</label>
<select id="speed">
    <option value="1">100%</option>
    <option value="0.5">50%</option>
    <option value="0.25">25%</option>
    <option value="0.125">12.5%</option>
</select>

<button id="go">Summon Frames</button>

<progress id="p" max="1" value="0"></progress>

<p id="status">Choose a short clip.</p>

<canvas id="c"></canvas>

<a id="save" hidden>Save MP4</a>

<p>
    Experimental GPU frame interpolation.
    Silent export. Maximum 720p.
    High FPS depends on device encoder support.
</p>

</section>

</main>

<script type="module">

import {
    Muxer,
    ArrayBufferTarget
} from 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/+esm';

const $ = id => document.getElementById(id);

const v = $('v');
const c = $('c');
const s = $('status');

let url;
let output;

$('file').onchange = () => {

    if (url) URL.revokeObjectURL(url);

    if (!$('file').files[0]) return;

    v.src = url = URL.createObjectURL(
        $('file').files[0]
    );

    $('save').hidden = true;
    s.textContent = 'Clip loaded.';
};

function seek(t) {

    return new Promise((resolve, reject) => {

        if (
            Math.abs(v.currentTime - t) < 0.00001 &&
            v.readyState >= 2
        ) {
            return resolve();
        }

        let timer = setTimeout(() => {
            v.removeEventListener('seeked', done);
            reject(Error('Seek timeout'));
        }, 10000);

        function done() {
            clearTimeout(timer);
            resolve();
        }

        v.addEventListener(
            'seeked',
            done,
            { once: true }
        );

        v.currentTime = t;
    });
}

$('go').onclick = async () => {

    let d;
    let enc;
    let ctx;

    $('go').disabled = true;
    $('file').disabled = true;
    $('save').hidden = true;
    $('p').value = 0;

    try {

        if (!navigator.gpu || !window.VideoEncoder) {
            throw Error(
                'WebGPU and WebCodecs are required. Update iOS and use Safari.'
            );
        }

        if (
            !v.videoWidth ||
            !Number.isFinite(v.duration)
        ) {
            throw Error('Load a clip first.');
        }

        v.pause();

        const fps = +$('fps').value;
        const src = +$('src').value;
        const speed = +$('speed').value;

        s.textContent = 'Initializing Shadow Engine...';

        let scale = Math.min(
            1,
            1280 / Math.max(
                v.videoWidth,
                v.videoHeight
            ),
            720 / Math.min(
                v.videoWidth,
                v.videoHeight
            )
        );

        c.width = Math.max(
            2,
            Math.floor(v.videoWidth * scale / 2) * 2
        );

        c.height = Math.max(
            2,
            Math.floor(v.videoHeight * scale / 2) * 2
        );

        let w = c.width;
        let h = c.height;

        let cfg = {
            codec: 'avc1.640034',
            width: w,
            height: h,
            bitrate: Math.min(
                40000000,
                Math.round(w * h * fps * 0.15)
            ),
            framerate: fps,
            avc: {
                format: 'avc'
            },
            hardwareAcceleration: 'prefer-hardware'
        };

        const supported =
            await VideoEncoder.isConfigSupported(cfg);

        if (!supported.supported) {
            throw Error(
                'Encoder does not support this FPS or resolution. Try a lower FPS.'
            );
        }

        let adapter =
            await navigator.gpu.requestAdapter();

        if (!adapter) {
            throw Error('GPU unavailable.');
        }

        d = await adapter.requestDevice();

        ctx = c.getContext('webgpu');

        let fmt =
            navigator.gpu.getPreferredCanvasFormat();

        ctx.configure({
            device: d,
            format: fmt,
            alphaMode: 'opaque'
        });

        // GPU shader

        let mod = d.createShaderModule({

            code: `

            @group(0) @binding(0)
            var a: texture_2d<f32>;

            @group(0) @binding(1)
            var b: texture_2d<f32>;

            @group(0) @binding(2)
            var sm: sampler;

            @group(0) @binding(3)
            var<uniform> t: f32;

            struct O {
                @builtin(position) p: vec4f,
                @location(0) uv: vec2f
            };

            @vertex
            fn vs(
                @builtin(vertex_index) i: u32
            ) -> O {

                var ps = array<vec2f, 3>(
                    vec2f(-1, -1),
                    vec2f(3, -1),
                    vec2f(-1, 3)
                );

                let p = ps[i];

                return O(
                    vec4f(p, 0, 1),
                    vec2f(
                        (p.x + 1) * 0.5,
                        (1 - p.y) * 0.5
                    )
                );
            }

            @fragment
            fn fs(o: O) -> @location(0) vec4f {

                let frameA = textureSample(
                    a, sm, o.uv
                );

                let frameB = textureSample(
                    b, sm, o.uv
                );

                return mix(frameA, frameB, t);
            }

            `
        });

        let pipe = d.createRenderPipeline({

            layout: 'auto',

            vertex: {
                module: mod,
                entryPoint: 'vs'
            },

            fragment: {
                module: mod,
                entryPoint: 'fs',
                targets: [{ format: fmt }]
            }
        });

        let size = [
            v.videoWidth,
            v.videoHeight
        ];

        let tex = () => d.createTexture({

            size,

            format: 'rgba8unorm',

            usage:
                GPUTextureUsage.TEXTURE_BINDING |
                GPUTextureUsage.COPY_DST |
                GPUTextureUsage.RENDER_ATTACHMENT
        });

        let a = tex();
        let b = tex();

        let u = d.createBuffer({

            size: 16,

            usage:
                GPUBufferUsage.UNIFORM |
                GPUBufferUsage.COPY_DST
        });

        let bg = d.createBindGroup({

            layout: pipe.getBindGroupLayout(0),

            entries: [

                {
                    binding: 0,
                    resource: a.createView()
                },

                {
                    binding: 1,
                    resource: b.createView()
                },

                {
                    binding: 2,
                    resource: d.createSampler({
                        minFilter: 'linear',
                        magFilter: 'linear'
                    })
                },

                {
                    binding: 3,
                    resource: {
                        buffer: u
                    }
                }
            ]
        });

        // MP4 export engine

        let mux = new Muxer({

            target: new ArrayBufferTarget(),

            video: {
                codec: 'avc',
                width: w,
                height: h,
                frameRate: fps
            },

            fastStart: 'in-memory'
        });

        let failure;

        enc = new VideoEncoder({

            output: (chunk, meta) => {
                mux.addVideoChunk(chunk, meta);
            },

            error: e => {
                failure = e;
            }
        });

        enc.configure(cfg);

        let count = Math.ceil(
            v.duration / speed * fps
        );

        if (count > 14400) {
            throw Error(
                'Clip too long. Use a shorter clip.'
            );
        }

        let last = -1;

        // Generate frames

        for (let i = 0; i < count; i++) {

            if (failure) throw failure;

            let pos = i / fps * speed * src;
            let k = Math.floor(pos);

            if (k !== last) {

                for (
                    let [n, texture] of [
                        [k, a],
                        [k + 1, b]
                    ]
                ) {

                    await seek(
                        Math.min(
                            n / src,
                            Math.max(
                                0,
                                v.duration - 0.001
                            )
                        )
                    );

                    d.queue.copyExternalImageToTexture(
                        { source: v },
                        { texture },
                        size
                    );
                }

                last = k;
            }

            d.queue.writeBuffer(
                u,
                0,
                new Float32Array([pos - k])
            );

            let cmd = d.createCommandEncoder();

            let pass = cmd.beginRenderPass({

                colorAttachments: [{

                    view: ctx
                        .getCurrentTexture()
                        .createView(),

                    loadOp: 'clear',

                    storeOp: 'store',

                    clearValue: [0, 0, 0, 1]
                }]
            });

            pass.setPipeline(pipe);
            pass.setBindGroup(0, bg);
            pass.draw(3);
            pass.end();

            d.queue.submit([cmd.finish()]);

            await d.queue.onSubmittedWorkDone();

            let timestamp = Math.round(
                i * 1000000 / fps
            );

            let duration = Math.round(
                (i + 1) * 1000000 / fps
            ) - timestamp;

            let frame = new VideoFrame(c, {
                timestamp,
                duration
            });

            enc.encode(frame, {
                keyFrame:
                    i % Math.round(fps * 2) === 0
            });

            frame.close();

            if (enc.encodeQueueSize > 8) {
                await enc.flush();
            }

            $('p').value = (i + 1) / count;

            s.textContent =
                `Summoning frames ${i + 1}/${count}` +
                ` · ${fps} FPS`;

            if (i % 8 === 0) {
                await new Promise(
                    resolve => setTimeout(resolve, 0)
                );
            }
        }

        s.textContent = 'Finalizing MP4...';

        await enc.flush();

        if (failure) throw failure;

        mux.finalize();

        if (output) {
            URL.revokeObjectURL(output);
        }

        output = URL.createObjectURL(

            new Blob(
                [mux.target.buffer],
                { type: 'video/mp4' }
            )
        );

        $('save').href = output;

        $('save').download =
            `AspTwixtor-${fps}fps.mp4`;

        $('save').hidden = false;

        s.textContent =
            'Ten Shadows — Conversion Complete.';

    } catch (e) {

        s.textContent = 'Error: ' + e.message;

    } finally {

        if (enc && enc.state !== 'closed') {
            enc.close();
        }

        if (ctx) ctx.unconfigure();

        if (d) d.destroy();

        $('go').disabled = false;
        $('file').disabled = false;
    }
};

</script>

</body>
</html>
