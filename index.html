<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AspTwixtor</title>

<style>
:root {
    color-scheme: dark;
    --background: #080c14;
    --panel: #111927;
    --border: #293950;
    --accent: #526f9c;
    --text: #e1e8f4;
    --muted: #8e9db5;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(
        ellipse at top,
        #24344c,
        var(--background) 65%
    );
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
}

main {
    max-width: 540px;
    margin: auto;
    padding: 30px 18px;
}

header {
    margin-bottom: 25px;
}

h1 {
    font-size: 36px;
    letter-spacing: -1.5px;
    margin: 0;
}

.subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
}

.panel {
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 15px 45px #0005;
}

label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 16px 0 7px;
}

input, select, button {
    width: 100%;
    font: inherit;
    color: var(--text);
    padding: 14px;
    background: #192438;
    border: 1px solid var(--border);
    border-radius: 10px;
}

button {
    background: var(--accent);
    font-weight: 600;
    margin-top: 18px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
}

#cancel {
    background: #202b3e;
    margin-top: 8px;
}

video {
    width: 100%;
    max-height: 350px;
    background: #05080d;
    border-radius: 12px;
    margin-top: 14px;
}

canvas {
    position: fixed;
    left: -10000px;
    top: 0;
    pointer-events: none;
}

progress {
    width: 100%;
    margin-top: 20px;
    height: 8px;
    accent-color: var(--accent);
}

#status {
    font-size: 13px;
    color: var(--muted);
    overflow-wrap: anywhere;
    line-height: 1.6;
}

#download {
    display: block;
    text-align: center;
    text-decoration: none;
    color: white;
    background: var(--accent);
    padding: 14px;
    border-radius: 10px;
    margin-top: 15px;
}

.badge {
    display: inline-block;
    background: #192438;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 12px;
    color: #a8bddb;
    font-size: 11px;
    margin-top: 10px;
}

footer {
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    line-height: 1.6;
    margin-top: 22px;
}

[hidden] {
    display: none !important;
}
</style>
</head>

<body>

<main>

<header>
    <h1>AspTwixtor</h1>
    <div class="subtitle">
        Mobile Video Interpolation
    </div>
    <span class="badge" id="gpuStatus">
        Checking GPU...
    </span>
</header>

<div class="panel">

    <label>Select Video</label>
    <input id="file" type="file" accept="video/*">

    <video id="video" controls playsinline muted></video>

    <label>Original FPS</label>
    <select id="sourceFPS">
        <option value="24">24 FPS</option>
        <option value="25">25 FPS</option>
        <option value="30" selected>30 FPS</option>
        <option value="60">60 FPS</option>
        <option value="120">120 FPS</option>
        <option value="240">240 FPS</option>
    </select>

    <label>Output FPS</label>
    <select id="outputFPS">
        <option value="30">30 FPS</option>
        <option value="60" selected>60 FPS</option>
        <option value="90">90 FPS</option>
        <option value="120">120 FPS</option>
        <option value="144">144 FPS</option>
        <option value="240">240 FPS</option>
    </select>

    <label>Playback Speed</label>
    <select id="speed">
        <option value="1">100% — Normal</option>
        <option value="0.75">75%</option>
        <option value="0.5">50%</option>
        <option value="0.25">25%</option>
        <option value="0.125">12.5%</option>
    </select>

    <label>Resolution</label>
    <select id="resolution">
        <option value="360">360p</option>
        <option value="480">480p</option>
        <option value="720" selected>720p</option>
        <option value="1080">1080p</option>
    </select>

    <label>Quality</label>
    <select id="quality">
        <option value="0.06">Low</option>
        <option value="0.1" selected>Medium</option>
        <option value="0.16">High</option>
    </select>

    <button id="convert">Convert Video</button>
    <button id="cancel" hidden>Cancel</button>

    <progress id="progress" value="0" max="1"></progress>

    <p id="status">Select a video to begin.</p>

    <canvas id="canvas"></canvas>

    <video id="preview" controls playsinline hidden></video>

    <a id="download" hidden>Download MP4</a>

</div>

<footer>
    AspTwixtor v0.3<br>
    Local GPU processing · No video uploads<br>
    Experimental frame blending · Silent export
</footer>

</main>

<script type="module">

const $ = id => document.getElementById(id);

const video = $('video');
const canvas = $('canvas');
const status = $('status');
const progress = $('progress');

let sourceURL;
let outputURL;
let cancelled = false;

const sleep = ms => new Promise(
    resolve => setTimeout(resolve, ms)
);

$('gpuStatus').textContent = navigator.gpu
    ? 'WebGPU Available'
    : 'WebGPU Unavailable';

$('file').onchange = () => {

    const file = $('file').files[0];

    if (!file) return;

    if (sourceURL) {
        URL.revokeObjectURL(sourceURL);
    }

    sourceURL = URL.createObjectURL(file);
    video.src = sourceURL;

    $('download').hidden = true;
    $('preview').hidden = true;

    progress.value = 0;
    status.textContent = 'Loading video...';
};

video.onloadedmetadata = () => {
    status.textContent =
        `${video.videoWidth} × ${video.videoHeight}` +
        ` · ${video.duration.toFixed(2)} seconds`;
};

video.onerror = () => {
    status.textContent = 'Unable to load video.';
};

$('cancel').onclick = () => {
    cancelled = true;
    status.textContent = 'Cancelling...';
};

function seek(time) {

    return new Promise((resolve, reject) => {

        if (
            Math.abs(video.currentTime - time) < 0.00001 &&
            video.readyState >= 2
        ) {
            resolve();
            return;
        }

        const timer = setTimeout(() => {
            cleanup();
            reject(new Error('Video seek timed out.'));
        }, 15000);

        function cleanup() {
            clearTimeout(timer);
            video.removeEventListener('seeked', done);
            video.removeEventListener('error', failed);
        }

        function done() {
            cleanup();
            resolve();
        }

        function failed() {
            cleanup();
            reject(new Error('Video decoding failed.'));
        }

        video.addEventListener('seeked', done);
        video.addEventListener('error', failed);

        video.currentTime = time;
    });
}

const shader = `

@group(0) @binding(0)
var frameA: texture_2d<f32>;

@group(0) @binding(1)
var frameB: texture_2d<f32>;

@group(0) @binding(2)
var smp: sampler;

@group(0) @binding(3)
var<uniform> amount: f32;

struct VertexOutput {
    @builtin(position) position: vec4f,
    @location(0) uv: vec2f
};

@vertex
fn vs(
    @builtin(vertex_index) index: u32
) -> VertexOutput {

    var positions = array<vec2f, 3>(
        vec2f(-1.0, -1.0),
        vec2f(3.0, -1.0),
        vec2f(-1.0, 3.0)
    );

    let p = positions[index];

    return VertexOutput(
        vec4f(p, 0.0, 1.0),
        vec2f(
            (p.x + 1.0) * 0.5,
            (1.0 - p.y) * 0.5
        )
    );
}

@fragment
fn fs(
    input: VertexOutput
) -> @location(0) vec4f {

    let a = textureSample(
        frameA, smp, input.uv
    );

    let b = textureSample(
        frameB, smp, input.uv
    );

    return mix(a, b, amount);
}

`;

async function getEncoderConfigs(w, h, fps, quality) {

    const configs = [];

    const macroblocks =
        Math.ceil(w / 16) *
        Math.ceil(h / 16) * fps;

    // Choose H.264 levels based on frame size
    // and processing requirements.

    let level = '34';

    if (macroblocks > 983040) {
        level = '3c';
    } else if (macroblocks > 522240) {
        level = '34';
    } else if (macroblocks > 245760) {
        level = '2a';
    } else {
        level = '28';
    }

    const codecs = [
        `avc1.6400${level}`,
        `avc1.4d00${level}`,
        `avc1.4200${level}`,
        'avc1.640033',
        'avc1.420033'
    ];

    for (const acceleration of [
        'prefer-hardware',
        'no-preference',
        'prefer-software'
    ]) {

        for (const codec of codecs) {

            const config = {
                codec,
                width: w,
                height: h,
                framerate: fps,
                bitrate: Math.min(
                    25000000,
                    Math.max(
                        500000,
                        Math.round(w * h * fps * quality)
                    )
                ),
                latencyMode: 'quality',
                hardwareAcceleration: acceleration,
                avc: {
                    format: 'avc'
                }
            };

            try {

                const result =
                    await VideoEncoder.isConfigSupported(
                        config
                    );

                if (result.supported) {
                    configs.push(result.config);
                }

            } catch (error) {
                console.warn(error);
            }
        }
    }

    return configs;
}

async function createGPU(w, h) {

    const adapter =
        await navigator.gpu.requestAdapter();

    if (!adapter) {
        throw new Error('GPU adapter unavailable.');
    }

    const device = await adapter.requestDevice();

    canvas.width = w;
    canvas.height = h;

    const context = canvas.getContext('webgpu');

    if (!context) {
        device.destroy();
        throw new Error('Unable to create GPU canvas.');
    }

    const format =
        navigator.gpu.getPreferredCanvasFormat();

    context.configure({
        device,
        format,
        alphaMode: 'opaque'
    });

    const module = device.createShaderModule({
        code: shader
    });

    const pipeline =
        await device.createRenderPipelineAsync({

            layout: 'auto',

            vertex: {
                module,
                entryPoint: 'vs'
            },

            fragment: {
                module,
                entryPoint: 'fs',
                targets: [{ format }]
            },

            primitive: {
                topology: 'triangle-list'
            }
        });

    const textureSize = [w, h];

    function createTexture() {

        return device.createTexture({

            size: textureSize,
            format: 'rgba8unorm',

            usage:
                GPUTextureUsage.TEXTURE_BINDING |
                GPUTextureUsage.COPY_DST |
                GPUTextureUsage.RENDER_ATTACHMENT
        });
    }

    const a = createTexture();
    const b = createTexture();

    const uniform = device.createBuffer({

        size: 16,

        usage:
            GPUBufferUsage.UNIFORM |
            GPUBufferUsage.COPY_DST
    });

    const sampler = device.createSampler({
        minFilter: 'linear',
        magFilter: 'linear'
    });

    const bindGroup = device.createBindGroup({

        layout: pipeline.getBindGroupLayout(0),

        entries: [
            {
                binding: 0,
                resource: a.createView()
            },
            {
                binding: 1,
                resource: b.createView()
            },
            {
                binding: 2,
                resource: sampler
            },
            {
                binding: 3,
                resource: {
                    buffer: uniform
                }
            }
        ]
    });

    const resizeCanvas =
        document.createElement('canvas');

    resizeCanvas.width = w;
    resizeCanvas.height = h;

    const resizeContext =
        resizeCanvas.getContext('2d', {
            alpha: false
        });

    function upload(texture) {

        resizeContext.drawImage(
            video, 0, 0, w, h
        );

        device.queue.copyExternalImageToTexture(
            { source: resizeCanvas },
            { texture },
            textureSize
        );
    }

    async function render(amount) {

        device.queue.writeBuffer(
            uniform,
            0,
            new Float32Array([amount])
        );

        const command =
            device.createCommandEncoder();

        const pass = command.beginRenderPass({

            colorAttachments: [{
                view: context
                    .getCurrentTexture()
                    .createView(),

                loadOp: 'clear',
                storeOp: 'store',

                clearValue: {
                    r: 0,
                    g: 0,
                    b: 0,
                    a: 1
                }
            }]
        });

        pass.setPipeline(pipeline);
        pass.setBindGroup(0, bindGroup);
        pass.draw(3);
        pass.end();

        device.queue.submit([
            command.finish()
        ]);

        await device.queue.onSubmittedWorkDone();
    }

    return {
        device,
        context,
        a,
        b,
        upload,
        render
    };
}

async function encodeVideo(
    gpu,
    config,
    fps,
    sourceFPS,
    speed,
    w,
    h,
    Muxer,
    ArrayBufferTarget
) {

    let encoder;
    let encoderError;

    const muxer = new Muxer({

        target: new ArrayBufferTarget(),

        video: {
            codec: 'avc',
            width: w,
            height: h,
            frameRate: fps
        },

        fastStart: 'in-memory'
    });

    try {

        encoder = new VideoEncoder({

            output: (chunk, metadata) => {

                try {
                    muxer.addVideoChunk(
                        chunk, metadata
                    );
                } catch (error) {
                    encoderError = error;
                }
            },

            error: error => {
                encoderError = error;
            }
        });

        encoder.configure(config);

        function checkEncoder() {

            if (cancelled) {
                throw new Error('Cancelled');
            }

            if (encoderError) {
                throw encoderError;
            }

            if (encoder.state !== 'configured') {
                throw new Error(
                    'Video encoder closed unexpectedly.'
                );
            }
        }

        const totalFrames = Math.ceil(
            video.duration / speed * fps
        );

        let previousIndex = -1;

        const started = performance.now();

        for (let i = 0; i < totalFrames; i++) {

            checkEncoder();

            const sourcePosition =
                i / fps * speed * sourceFPS;

            const index =
                Math.floor(sourcePosition);

            const amount =
                sourcePosition - index;

            if (index !== previousIndex) {

                const lastTime = Math.max(
                    0,
                    video.duration - 0.001
                );

                await seek(
                    Math.min(
                        index / sourceFPS,
                        lastTime
                    )
                );

                gpu.upload(gpu.a);

                await seek(
                    Math.min(
                        (index + 1) / sourceFPS,
                        lastTime
                    )
                );

                gpu.upload(gpu.b);

                previousIndex = index;
            }

            await gpu.render(amount);

            checkEncoder();

            const timestamp = Math.round(
                i * 1000000 / fps
            );

            const duration = Math.round(
                (i + 1) * 1000000 / fps
            ) - timestamp;

            const frame = new VideoFrame(
                canvas,
                {
                    timestamp,
                    duration
                }
            );

            try {

                checkEncoder();

                encoder.encode(frame, {
                    keyFrame:
                        i % (fps * 2) === 0
                });

            } finally {
                frame.close();
            }

            // Prevent the encoder queue from
            // consuming too much phone memory.

            const queueStart = performance.now();

            while (encoder.encodeQueueSize > 4) {

                checkEncoder();

                if (
                    performance.now() -
                    queueStart > 30000
                ) {
                    throw new Error(
                        'Encoder queue timed out.'
                    );
                }

                await sleep(10);
            }

            progress.value =
                (i + 1) / totalFrames;

            const percent = Math.round(
                progress.value * 100
            );

            const elapsed =
                (performance.now() - started) / 1000;

            const remaining =
                elapsed / (i + 1) *
                (totalFrames - i - 1);

            status.textContent =
                `Processing: ${percent}%` +
                ` · ${i + 1}/${totalFrames} frames` +
                ` · ${Math.ceil(remaining)}s remaining`;

            if (i % 4 === 0) {
                await sleep(0);
            }
        }

        checkEncoder();

        status.textContent = 'Finalizing video...';

        await encoder.flush();

        if (encoderError) {
            throw encoderError;
        }

        if (cancelled) {
            throw new Error('Cancelled');
        }

        muxer.finalize();

        return new Blob(
            [muxer.target.buffer],
            { type: 'video/mp4' }
        );

    } finally {

        if (
            encoder &&
            encoder.state !== 'closed'
        ) {
            encoder.close();
        }
    }
}

$('convert').onclick = async () => {

    let gpu;

    cancelled = false;

    $('convert').disabled = true;
    $('file').disabled = true;
    $('cancel').hidden = false;
    $('download').hidden = true;
    $('preview').hidden = true;

    progress.value = 0;

    try {

        if (!navigator.gpu) {
            throw new Error(
                'WebGPU is unavailable. Update iOS and use Safari.'
            );
        }

        if (
            !window.VideoEncoder ||
            !window.VideoFrame
        ) {
            throw new Error(
                'WebCodecs is unavailable on this device.'
            );
        }

        if (
            !video.videoWidth ||
            !Number.isFinite(video.duration)
        ) {
            throw new Error(
                'Select a valid video first.'
            );
        }

        video.pause();

        const fps = Number(
            $('outputFPS').value
        );

        const sourceFPS = Number(
            $('sourceFPS').value
        );

        const speed = Number(
            $('speed').value
        );

        const resolution = Number(
            $('resolution').value
        );

        const quality = Number(
            $('quality').value
        );

        const totalFrames = Math.ceil(
            video.duration / speed * fps
        );

        if (totalFrames > 14400) {
            throw new Error(
                'Too many output frames. Use a shorter clip.'
            );
        }

        const scale = Math.min(
            1,
            resolution / Math.min(
                video.videoWidth,
                video.videoHeight
            ),
            resolution * 16 / 9 / Math.max(
                video.videoWidth,
                video.videoHeight
            )
        );

        const w = Math.max(
            2,
            Math.floor(
                video.videoWidth * scale / 2
            ) * 2
        );

        const h = Math.max(
            2,
            Math.floor(
                video.videoHeight * scale / 2
            ) * 2
        );

        status.textContent =
            'Loading MP4 export engine...';

        const {
            Muxer,
            ArrayBufferTarget
        } = await import(
            'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/+esm'
        );

        status.textContent =
            'Checking encoder compatibility...';

        const configs = await getEncoderConfigs(
            w, h, fps, quality
        );

        if (!configs.length) {
            throw new Error(
                'Unsupported FPS or resolution. Try 480p or a lower FPS.'
            );
        }

        status.textContent = 'Initializing GPU...';

        gpu = await createGPU(w, h);

        let blob;
        let lastError;

        // Retry with another encoding configuration
        // if the current encoder fails.

        for (
            let attempt = 0;
            attempt < Math.min(configs.length, 6);
            attempt++
        ) {

            if (cancelled) {
                throw new Error('Cancelled');
            }

            progress.value = 0;

            status.textContent =
                `Starting encoder ${attempt + 1}...`;

            try {

                blob = await encodeVideo(
                    gpu,
                    configs[attempt],
                    fps,
                    sourceFPS,
                    speed,
                    w,
                    h,
                    Muxer,
                    ArrayBufferTarget
                );

                break;

            } catch (error) {

                if (cancelled) {
                    throw new Error('Cancelled');
                }

                lastError = error;

                console.warn(
                    'Encoder attempt failed:',
                    error
                );

                status.textContent =
                    'Encoder failed. Trying another configuration...';

                await sleep(500);
            }
        }

        if (!blob) {

            throw new Error(
                'Encoding failed: ' +
                (lastError?.message || 'Unknown error') +
                '. Try a lower resolution or FPS.'
            );
        }

        if (outputURL) {
            URL.revokeObjectURL(outputURL);
        }

        outputURL = URL.createObjectURL(blob);

        $('preview').src = outputURL;
        $('preview').hidden = false;

        $('download').href = outputURL;

        $('download').download =
            `AspTwixtor-${fps}fps.mp4`;

        $('download').hidden = false;

        progress.value = 1;

        const size = (
            blob.size / 1024 / 1024
        ).toFixed(2);

        status.textContent =
            `Conversion complete · ${fps} FPS` +
            ` · ${w} × ${h} · ${size} MB`;

    } catch (error) {

        status.textContent = cancelled
            ? 'Conversion cancelled.'
            : 'Error: ' + error.message;

    } finally {

        if (gpu) {
            gpu.context.unconfigure();
            gpu.device.destroy();
        }

        $('convert').disabled = false;
        $('file').disabled = false;
        $('cancel').hidden = true;
    }
};

</script>

</body>
</html>
