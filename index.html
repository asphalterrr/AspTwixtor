<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MobileTwixtor</title>

<style>
body {
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
    max-width: 500px;
    margin: auto;
}

button, select, input {
    box-sizing: border-box;
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    background: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 10px;
}

button {
    background: #7047eb;
    font-weight: bold;
}

canvas, video {
    width: 100%;
    border-radius: 10px;
    background: black;
}

progress {
    width: 100%;
}
</style>
</head>

<body>

<h1>MobileTwixtor</h1>
<p>Mobile GPU Frame Interpolation</p>

<input type="file" id="upload" accept="video/*">

<video id="video" playsinline muted></video>

<label>Original FPS</label>
<select id="sourceFPS">
    <option value="24">24 FPS</option>
    <option value="30" selected>30 FPS</option>
    <option value="60">60 FPS</option>
</select>

<label>Interpolation</label>
<select id="multiplier">
    <option value="2">2x</option>
    <option value="4">4x</option>
    <option value="8">8x</option>
</select>

<button id="convert">Convert Video</button>

<progress id="progress" value="0" max="100"></progress>
<p id="status">Waiting for video...</p>

<canvas id="output"></canvas>

<a id="download" hidden>Save Video</a>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("output");
const status = document.getElementById("status");
const progress = document.getElementById("progress");
const button = document.getElementById("convert");

let inputURL;

document.getElementById("upload").onchange = e => {
    const file = e.target.files[0];
    if (!file) return;

    if (inputURL) URL.revokeObjectURL(inputURL);
    inputURL = URL.createObjectURL(file);

    video.src = inputURL;
    status.textContent = "Video loaded";
};

const shader = `
@group(0) @binding(0)
var frameA: texture_2d<f32>;

@group(0) @binding(1)
var frameB: texture_2d<f32>;

@group(0) @binding(2)
var frameSampler: sampler;

@group(0) @binding(3)
var<uniform> amount: f32;

struct VertexOutput {
    @builtin(position) position: vec4f,
    @location(0) uv: vec2f
}

@vertex
fn vertexMain(
    @builtin(vertex_index) index: u32
) -> VertexOutput {

    var positions = array<vec2f, 3>(
        vec2f(-1.0, -1.0),
        vec2f(3.0, -1.0),
        vec2f(-1.0, 3.0)
    );

    let p = positions[index];

    var output: VertexOutput;
    output.position = vec4f(p, 0.0, 1.0);
    output.uv = vec2f(
        (p.x + 1.0) * 0.5,
        (1.0 - p.y) * 0.5
    );

    return output;
}

@fragment
fn fragmentMain(
    input: VertexOutput
) -> @location(0) vec4f {

    let a = textureSample(
        frameA, frameSampler, input.uv
    );

    let b = textureSample(
        frameB, frameSampler, input.uv
    );

    return mix(a, b, amount);
}
`;

function seek(time) {
    return new Promise((resolve, reject) => {
        if (
            Math.abs(video.currentTime - time) < 0.0001 &&
            video.readyState >= 2
        ) {
            resolve();
            return;
        }

        const timeout = setTimeout(() => {
            video.removeEventListener("seeked", done);
            reject(new Error("Video seek timed out"));
        }, 10000);

        function done() {
            clearTimeout(timeout);
            resolve();
        }

        video.addEventListener(
            "seeked", done, { once: true }
        );

        video.currentTime = time;
    });
}

const wait = ms => new Promise(
    resolve => setTimeout(resolve, ms)
);

async function convert() {
    if (!navigator.gpu) {
        status.textContent = "WebGPU is not supported.";
        return;
    }

    if (!video.videoWidth) {
        status.textContent = "Load a video first.";
        return;
    }

    if (!window.MediaRecorder || !canvas.captureStream) {
        status.textContent = "Video export is not supported.";
        return;
    }

    button.disabled = true;

    let device;
    let recorder;
    let stream;

    try {
        video.pause();

        status.textContent = "Starting GPU...";

        const adapter = await navigator.gpu.requestAdapter();

        if (!adapter) {
            throw new Error("GPU unavailable");
        }

        device = await adapter.requestDevice();

        // Limit resolution to reduce memory usage.
        const scale = Math.min(
            1, 1280 / Math.max(
                video.videoWidth,
                video.videoHeight
            )
        );

        canvas.width = Math.max(
            2, Math.floor(video.videoWidth * scale / 2) * 2
        );

        canvas.height = Math.max(
            2, Math.floor(video.videoHeight * scale / 2) * 2
        );

        const context = canvas.getContext("webgpu");
        const format = navigator.gpu.getPreferredCanvasFormat();

        context.configure({
            device,
            format,
            alphaMode: "opaque"
        });

        const module = device.createShaderModule({
            code: shader
        });

        const pipeline = device.createRenderPipeline({
            layout: "auto",
            vertex: {
                module,
                entryPoint: "vertexMain"
            },
            fragment: {
                module,
                entryPoint: "fragmentMain",
                targets: [{ format }]
            },
            primitive: {
                topology: "triangle-list"
            }
        });

        const textureSize = [
            video.videoWidth,
            video.videoHeight
        ];

        function createTexture() {
            return device.createTexture({
                size: textureSize,
                format: "rgba8unorm",
                usage:
                    GPUTextureUsage.TEXTURE_BINDING |
                    GPUTextureUsage.COPY_DST |
                    GPUTextureUsage.RENDER_ATTACHMENT
            });
        }

        const frameA = createTexture();
        const frameB = createTexture();

        const sampler = device.createSampler({
            magFilter: "linear",
            minFilter: "linear"
        });

        const uniform = device.createBuffer({
            size: 16,
            usage:
                GPUBufferUsage.UNIFORM |
                GPUBufferUsage.COPY_DST
        });

        const bindGroup = device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0),
            entries: [
                {
                    binding: 0,
                    resource: frameA.createView()
                },
                {
                    binding: 1,
                    resource: frameB.createView()
                },
                {
                    binding: 2,
                    resource: sampler
                },
                {
                    binding: 3,
                    resource: { buffer: uniform }
                }
            ]
        });

        function render(amount) {
            device.queue.writeBuffer(
                uniform, 0, new Float32Array([amount])
            );

            const encoder = device.createCommandEncoder();

            const pass = encoder.beginRenderPass({
                colorAttachments: [{
                    view: context.getCurrentTexture().createView(),
                    loadOp: "clear",
                    storeOp: "store",
                    clearValue: [0, 0, 0, 1]
                }]
            });

            pass.setPipeline(pipeline);
            pass.setBindGroup(0, bindGroup);
            pass.draw(3);
            pass.end();

            device.queue.submit([encoder.finish()]);
        }

        function copyFrame(texture) {
            device.queue.copyExternalImageToTexture(
                { source: video },
                { texture },
                textureSize
            );
        }

        const fps = Number(
            document.getElementById("sourceFPS").value
        );

        const multiplier = Number(
            document.getElementById("multiplier").value
        );

        const total = Math.max(
            1, Math.ceil(video.duration * fps)
        );

        // Keep playback at the original FPS
        // to create slow motion.
        stream = canvas.captureStream(fps);

        const mimeType = [
            "video/mp4",
            "video/webm;codecs=vp8",
            "video/webm"
        ].find(type =>
            MediaRecorder.isTypeSupported(type)
        );

        recorder = mimeType
            ? new MediaRecorder(stream, { mimeType })
            : new MediaRecorder(stream);

        const chunks = [];

        recorder.ondataavailable = e => {
            if (e.data.size) chunks.push(e.data);
        };

        const finished = new Promise(resolve => {
            recorder.onstop = resolve;
        });

        await seek(0);
        copyFrame(frameA);
        copyFrame(frameB);
        render(0);

        recorder.start();

        for (let i = 0; i < total; i++) {

            await seek(Math.min(
                i / fps,
                Math.max(0, video.duration - 0.001)
            ));

            copyFrame(frameA);

            await seek(Math.min(
                (i + 1) / fps,
                Math.max(0, video.duration - 0.001)
            ));

            copyFrame(frameB);

            for (let j = 0; j < multiplier; j++) {
                render(j / multiplier);

                await device.queue.onSubmittedWorkDone();

                await wait(1000 / fps);
            }

            progress.value = (i + 1) / total * 100;

            status.textContent =
                "Processing: " +
                Math.round(progress.value) + "%";
        }

        recorder.stop();
        await finished;

        const type = recorder.mimeType || "video/webm";
        const blob = new Blob(chunks, { type });

        const download = document.getElementById("download");

        if (download.href.startsWith("blob:")) {
            URL.revokeObjectURL(download.href);
        }

        download.href = URL.createObjectURL(blob);

        download.download = type.includes("mp4")
            ? "MobileTwixtor.mp4"
            : "MobileTwixtor.webm";

        download.hidden = false;

        status.textContent = "Conversion complete!";

    } catch (error) {
        status.textContent = "Error: " + error.message;

    } finally {
        if (recorder && recorder.state !== "inactive") {
            recorder.stop();
        }

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }

        if (device) device.destroy();

        button.disabled = false;
    }
}

button.onclick = convert;
</script>

</body>
</html>
